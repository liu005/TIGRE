name: CPU and headless checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: python -m pip install numpy scipy matplotlib tqdm PyYAML pytest
      - name: Run CPU and headless regression checks
        run: python Python/tests/run_cpu_checks.py --junitxml=cpu-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-results-python-${{ matrix.python }}
          path: cpu-results.xml
          if-no-files-found: warn
